repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format
        language: system
        types: [python]
      - id: pylint
        name: Pylint
        entry: python -m pylint src tests
        language: system
        types: [python]
        pass_filenames: false
      - id: unit-tests
        name: Unit tests
        entry: python -m unittest discover -s tests
        language: system
        types: [python]
        pass_filenames: false
